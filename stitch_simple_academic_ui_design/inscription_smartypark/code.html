<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartyPark - Inscription</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {

                        "secondary-container": "#dae2fd",
                        "slate-800": "#1e293b",
                        "error-container": "#ffdad6",
                        "secondary": "#565e74",
                        "on-surface": "#161d19",
                        "surface-tint": "#006c49",
                        "tertiary-container": "#fc7c78",
                        "surface-container-low": "#eef6ee",

                        "error": "#ba1a1a",
                        "surface-variant": "#dde4dd",
                        "primary-fixed": "#6ffbbe",
                        "warning": "#f59e0b",
                        "success": "#10b981",
                        "inverse-on-surface": "#ebf3eb",
                        "surface-bright": "#f4fbf4",
                        "on-tertiary-container": "#711419",
                        "secondary-fixed": "#dae2fd",
                        "on-secondary-container": "#5c647a",
                        "on-tertiary-fixed": "#410005",
                        "inverse-primary": "#4edea3",
                        "slate-50": "#f8fafc",
                        "tertiary-fixed": "#ffdad7",
                        "surface-dim": "#d4dcd5",
                        "surface": "#f4fbf4",
                        "tertiary-fixed-dim": "#ffb3af",
                        "background": "#f4fbf4",

                        "on-secondary-fixed": "#131b2e",

                    },
                    "borderRadius": {

                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #dde4dd;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #bbcabf;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gradient-to-b from-[#F4FBF4] to-white min-h-screen font-sans text-on-background flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed per logic: Transactional page, but requested in layout via json styling as a simplified header) -->
<!-- Re-interpreting as a simple centered brand header per design guidelines for transactional pages -->
<main class="flex-1 flex items-center justify-center p-margin-mobile">
<div class="w-full max-w-md">
<!-- Header Section -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-md shadow-sm">
<span class="material-symbols-outlined text-display" data-icon="eco">eco</span>
</div>
<h1 class="font-display text-display text-primary tracking-tight mb-sm">SmartyPark</h1>
<p class="font-body-lg text-body-lg text-secondary">Créer un compte pour rejoindre la communauté.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgba(30,41,59,0.08)] border border-slate-100 p-lg relative overflow-hidden">
<!-- Subtle decorative blob -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container rounded-full blur-3xl opacity-20 pointer-events-none"></div>
<form action="#" class="space-y-lg relative z-10" method="POST">
<!-- Avatar Upload -->
<div class="flex flex-col items-center justify-center">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center overflow-hidden transition-colors group-hover:border-primary group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-4xl text-outline" data-icon="person">person</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary w-8 h-8 rounded-full flex items-center justify-center shadow-md transform translate-x-1/4 translate-y-1/4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</div>
</div>
</div>
<!-- Name Fields (2 Columns) -->
<div class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="firstName">Prénom</label>
<input class="w-full bg-transparent border border-slate-200 rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="firstName" name="firstName" placeholder="Ex: Jean" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="lastName">Nom</label>
<input class="w-full bg-transparent border border-slate-200 rounded-lg px-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="lastName" name="lastName" placeholder="Ex: Dupont" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="w-full bg-transparent border border-slate-200 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="email" name="email" placeholder="exemple@email.com" type="email"/>
</div>
</div>
<!-- Phone Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="phone">Téléphone</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="call">call</span>
</div>
<input class="w-full bg-transparent border border-slate-200 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="phone" name="phone" placeholder="+33 6 12 34 56 78" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Mot de passe</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="w-full bg-transparent border border-slate-200 rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<p class="font-body-md text-[13px] text-secondary mt-1">Au moins 6 caractères</p>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full bg-primary hover:bg-opacity-90 text-on-primary font-label-lg text-label-lg py-3.5 px-4 rounded-lg shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>S'inscrire</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="text-center">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed-dim transition-colors inline-flex items-center gap-1" href="#">
<span>Déjà un compte ? Se connecter</span>
</a>
</div>
</div>
</form>
</div>
<p class="text-center font-body-md text-[13px] text-outline mt-lg">
                En vous inscrivant, vous acceptez nos <a class="underline hover:text-primary transition-colors" href="#">Conditions d'utilisation</a> et notre <a class="underline hover:text-primary transition-colors" href="#">Politique de confidentialité</a>.
            </p>
</div>
</main>
</body></html>

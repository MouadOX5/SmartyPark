<!DOCTYPE html><html class="light" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Suggest a New Space - CrowdFlow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#684000",
                        "primary": "#006c49",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#2a1700",
                        "surface-container-high": "#e2e8f8",
                        "on-surface-variant": "#3c4a42",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#dce2f3",
                        "tertiary": "#bc0b3b",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#dce2f3",
                        "on-tertiary-container": "#780021",
                        "on-secondary-fixed-variant": "#653e00",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#ffb95f",
                        "surface-dim": "#d3daea",
                        "on-primary": "#ffffff",
                        "background": "#f9f9ff",
                        "surface-tint": "#006c49",
                        "secondary-fixed": "#ffddb8",
                        "on-error": "#ffffff",
                        "tertiary-container": "#ff7886",
                        "on-primary-container": "#00422b",
                        "tertiary-fixed": "#ffdadb",
                        "primary-fixed": "#6ffbbe",
                        "on-tertiary-fixed-variant": "#92002a",
                        "secondary": "#855300",
                        "outline-variant": "#bbcabf",
                        "on-surface": "#151c27",
                        "surface": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "inverse-surface": "#2a313d",
                        "inverse-primary": "#4edea3",
                        "on-background": "#151c27",
                        "on-primary-fixed": "#002113",
                        "on-primary-fixed-variant": "#005236",
                        "surface-container-low": "#f0f3ff",
                        "primary-container": "#10b981",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#40000d",
                        "outline": "#6c7a71",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "secondary-container": "#fea619",
                        "inverse-on-surface": "#ebf1ff",
                        "surface-container": "#e7eefe",
                        "primary-fixed-dim": "#4edea3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "margin": "20px",
                        "gutter": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Fluid Typography and Spacing */
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface flex justify-between items-center px-margin h-16 w-full docked full-width top-0 border-b border-outline-variant dark:border-outline flat no shadows z-40 sticky">
<button aria-label="Menu" class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">SmartyPark</div>
<button aria-label="Notifications" class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow container mx-auto px-margin py-lg pb-[100px] md:pb-lg flex justify-center">
<div class="w-full max-w-2xl">
<!-- Header Section -->
<div class="mb-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">Proposer un espace</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Aidez la communauté en ajoutant un nouveau lieu à suivre.</p>
</div>
<!-- Form Card -->
<div class="glass-panel p-md md:p-lg shadow-[0_4px_12px_0_rgba(0,0,0,0.04)] bg-surface-container-lowest rounded-lg">
<form action="#" class="space-y-lg" method="POST">
<!-- Space Name -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-sm" for="space_name">Nom de l'espace <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full rounded-md border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors placeholder:text-outline" id="space_name" name="space_name" placeholder="Ex: Parc des Buttes-Chaumont" required="" type="text">
</div>
</div>
<!-- Description -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-sm" for="description">Description</label>
<textarea class="w-full rounded-md border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors placeholder:text-outline resize-y" id="description" name="description" placeholder="Décrivez brièvement le lieu et son utilité publique..." rows="3"></textarea>
</div>
<!-- Category -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-sm" for="category">Catégorie <span class="text-error">*</span></label>
<div class="relative">
<select class="appearance-none w-full rounded-md border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors pr-10" id="category" name="category" required="">
<option disabled="" selected="" value="">Sélectionnez une catégorie</option>
<option value="park">Parc / Espace Vert</option>
<option value="library">Bibliothèque / Médiathèque</option>
<option value="plaza">Place Publique</option>
<option value="sport">Terrain de Sport</option>
<option value="other">Autre</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Map Location Button -->
<div class="pt-sm">
<label class="block font-label-lg text-label-lg text-on-surface mb-sm">Localisation <span class="text-error">*</span></label>
<button class="w-full flex items-center justify-center gap-sm bg-surface-container-low border border-outline-variant hover:bg-surface-variant text-primary font-label-lg text-label-lg py-md rounded-lg transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined" data-icon="pin_drop" data-weight="fill">pin_drop</span>
                            Définir la position sur la carte
                        </button>
<p class="mt-2 text-[11px] text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="info">info</span>
                            Veuillez sélectionner un point précis sur la carte.
                        </p>
</div>
<!-- Submit Button -->
<div class="pt-lg border-t border-outline-variant mt-xl">
<button class="w-full bg-primary hover:bg-primary-fixed-variant text-on-primary font-headline-sm text-headline-sm py-md shadow-[0_4px_12px_0_rgba(0,0,0,0.1)] transition-all active:scale-[0.98] flex justify-center items-center gap-sm rounded-lg" type="submit">
                            Soumettre
                            <span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
</button>
</div>
</form>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface dark:bg-surface shadow-[0_-4px_12px_0_rgba(0,0,0,0.04)] docked full-width bottom-0 rounded-t-xl fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 border-t-0">
<!-- Tab 1: Map -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 transition-transform group" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors" data-icon="map">map</span>
<span class="font-label-sm text-label-sm group-hover:text-primary transition-colors">Explorer</span>
</a>
<!-- Tab 2: Add Space (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-4 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" data-weight="fill">add</span>
<span class="font-label-sm text-label-sm">Proposer</span>
</a>
<!-- Tab 3: Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 transition-transform group" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors" data-icon="person">person</span>
<span class="font-label-sm text-label-sm group-hover:text-primary transition-colors">Profil</span>
</a>
</nav>


</body></html>

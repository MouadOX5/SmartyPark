spring.application.name=SmartyPark
# ==========================
# SERVER
# ==========================
server.port=8080

# ==========================
# DATABASE
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/smartypark_db
spring.datasource.username=smarty_user
spring.datasource.password=smarty_pass

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. Empêche la suppression/récréation automatique des tables à chaque redémarrage
spring.jpa.hibernate.ddl-auto=update

# 2. Supprime l'avertissement 'spring.jpa.open-in-view' (bonnes pratiques de performance)
spring.jpa.open-in-view=false

# 3. Supprime l'avertissement 'PostgreSQLDialect'
# Retirez complètement la ligne 'spring.jpa.database-platform' ou 'hibernate.dialect'

# La clé doit contenir au moins 64 caractères pour l'algorithme HS512
app.jwt-secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971


# ==========================
# TIMEZONE
# ==========================
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca

# ==========================
# UPLOAD DES PHOTOS
# ==========================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# ============================================================================
# Configuration du géofencing pour les présences
# ============================================================================
# Rayon autorisé autour d'un espace public pour déclarer ou maintenir une présence (en mètres)
presence.geofence.radius-meters=100

# ============================================================================
# Configuration du module d'affluence
# ============================================================================

# Pondération entre déclarations récentes et historique (doit sommer à 1.0)
affluence.recent-weight=0.70
affluence.historical-weight=0.30

# Fenêtre temporelle pour les déclarations récentes (minutes)
affluence.recent-window-minutes=60

# Fenêtre horaire pour l'historique (minutes autour de l'heure actuelle)
affluence.historical-window-minutes=30

# Profondeur de l'historique en jours (données plus anciennes = moins pertinentes)
affluence.historical-depth-days=90

# Seuils de mapping score → statut
affluence.seuil-disponible=1.6
affluence.seuil-presque-sature=2.4

# Distance max pour déclarer l'affluence (mètres)
affluence.declaration-distance-max-meters=500

# ============================================================================
# Configuration de l'URL de base pour la construction des URLs d'images
# ============================================================================
# En local : http://localhost:8080
# Pour appareil physique sur le même réseau : http://192.168.1.x:8080
# En production : https://api.smartypark.ma
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.application.name=SmartyPark
# ==========================
# SERVER
# ==========================
server.port=8080

# ==========================
# DATABASE
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/smartypark_db
spring.datasource.username=smarty_user
spring.datasource.password=smarty_pass

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 1. Empêche la suppression/récréation automatique des tables à chaque redémarrage
spring.jpa.hibernate.ddl-auto=update

# 2. Supprime l'avertissement 'spring.jpa.open-in-view' (bonnes pratiques de performance)
spring.jpa.open-in-view=false

# 3. Supprime l'avertissement 'PostgreSQLDialect'
# Retirez complètement la ligne 'spring.jpa.database-platform' ou 'hibernate.dialect'

# La clé doit contenir au moins 64 caractères pour l'algorithme HS512
app.jwt-secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971


# ==========================
# TIMEZONE
# ==========================
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca

# ==========================
# UPLOAD DES PHOTOS
# ==========================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB